name: Build Raksha Geo Fencing

on:
  push:
    branches:
      - main
      - "release/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Check signing secrets
        id: check_signing
        env:
          KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "has_signing=true" >> $GITHUB_OUTPUT
          else
            echo "has_signing=false" >> $GITHUB_OUTPUT
            echo "⚠️ Signing secrets not set — building debug APK instead."
          fi

      - name: Restore signing keystore
        if: steps.check_signing.outputs.has_signing == 'true'
        env:
          KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          mkdir -p signing
          echo "$KEYSTORE" | base64 --decode > signing/raksha-release.jks

      - name: Create signing properties
        if: steps.check_signing.outputs.has_signing == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          cat > signing.properties <<EOF
          storeFile=signing/raksha-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release APK (signed)
        if: steps.check_signing.outputs.has_signing == 'true'
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Build debug APK (unsigned fallback)
        if: steps.check_signing.outputs.has_signing == 'false'
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        id: find_apk
        run: |
          APK=$(find app/build/outputs/apk -name '*.apk' | head -n 1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "Found APK: $APK"

      - name: Prepare release directory
        run: |
          mkdir -p release
          cp "${{ steps.find_apk.outputs.apk_path }}" "release/Raksha-GeoFencing-${{ github.run_number }}.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Raksha-GeoFencing-${{ github.run_number }}
          path: release/*.apk
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Raksha Geo Fencing v1.0.${{ github.run_number }}"
          body: |
            ## Raksha Geo Fencing Build ${{ github.run_number }}
            
            > ⚠️ This is a **debug build** (unsigned). Set up signing secrets for a signed release APK.
            > See README for signing setup instructions.
          files: release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove signing files
        if: always()
        run: |
          rm -f signing/raksha-release.jks signing.properties
